{% extends "base.html" %}
 
{% block title %}Register | Information Station{% endblock %}
 
{% block content %}
<h1>Create an account</h1>
 
{% if errors %}
    <div role="alert">
        <ul>
            {% for error in errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
{% endif %}
 
<form method="post">
    {% csrf_token %}
 
    <label for="id_username">Username</label>
    <input type="text" id="id_username" name="username"
           value="{{ form_data.username }}"
           autocomplete="username" required autofocus>
 
    <label for="id_email">Email address</label>
    <input type="email" id="id_email" name="email"
           value="{{ form_data.email }}"
           autocomplete="email" required>
 
    <label for="id_password">Password</label>
    <input type="password" id="id_password" name="password"
           autocomplete="new-password" required>
 
    <label for="id_password_confirm">Confirm password</label>
    <input type="password" id="id_password_confirm" name="password_confirm"
           autocomplete="new-password" required>
 
    <label for="id_account_type">Account type</label>
    <select id="id_account_type" name="account_type" required>
        <option value="" disabled
                {% if not form_data.account_type %}selected{% endif %}>
            -- Select --
        </option>
        <option value="reader"
                {% if form_data.account_type == "reader" %}selected{% endif %}>
            Reader
        </option>
        <option value="journalist"
                {% if form_data.account_type == "journalist" %}selected{% endif %}>
            Journalist
        </option>
    </select>
 
    <button type="submit">Register</button>
</form>
 
<p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
{% endblock %}
